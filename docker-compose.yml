# 默认使用 GHCR 镜像，可通过 LXSC_IMAGE 指定版本或本地镜像。
services:
  lxsc:
    image: ${LXSC_IMAGE:-ghcr.io/lengyuesky/lxsc:latest}
    restart: unless-stopped
    ports:
      - "27880:8080"
    volumes:
      - ./data:/data
    environment:
      LXSC_ADMIN_USER: ${LXSC_ADMIN_USER:-admin}
      LXSC_ADMIN_PASSWORD: ${LXSC_ADMIN_PASSWORD:?请设置首次启动的管理员强密码}
