name: 检查与镜像

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: 测试、许可与可复现构建
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 检出源码，不保存令牌
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: 安装 Node LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: 安装固定版本 Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Go 竞态检测、静态检查与 Node 单元测试
        run: bash scripts/check.sh --race
      - name: 记录合成性能基准，不以机器耗时设置脆弱门槛
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/music ./internal/db -run '^$' -bench 'Benchmark(TemporaryCache|ConcurrentSearch|PersistentURLCacheHit|ListeningWithUserLookups)$' -benchmem -benchtime=100x -count=3 | tee "$RUNNER_TEMP/lxsc-benchmarks.txt"
          go test ./internal/db -run '^$' -bench 'Benchmark(TrackSubstringSearch|LibraryTrackIDs)$' -benchmem -benchtime=20x -count=3 | tee -a "$RUNNER_TEMP/lxsc-benchmarks.txt"
          go test ./internal/db -run '^$' -bench 'Benchmark(TrackSearchScenarios|PlaylistBatchWrite)$' -benchmem -benchtime=20x -count=3 | tee -a "$RUNNER_TEMP/lxsc-benchmarks.txt"
      - name: 按锁文件构建并核对提交的 JS 产物
        working-directory: js-bridge
        run: |
          bun install --frozen-lockfile
          bun run build
          git diff --exit-code -- bun.lock bundle-inputs.json ../internal/assets/js/
      - name: 核对实际分发依赖和许可原文
        run: node scripts/licenses.mjs --check
      - name: 保存性能基准
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-baseline
          path: ${{ runner.temp }}/lxsc-benchmarks.txt
          retention-days: 14

  browser:
    name: 隔离 Chromium 验收
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出源码，不保存令牌
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: 安装 Node LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Playwright 1.58.2 的归档解包在 Node 26 下可能挂起，使用已验证的 LTS。
          node-version: '24.21.0'
      - name: 安装锁定的浏览器测试依赖
        timeout-minutes: 3
        run: npm --prefix tests/web ci --ignore-scripts
      - name: 安装匹配版本的 Chromium Headless Shell
        timeout-minutes: 5
        env:
          DEBUG: pw:install
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
        run: node tests/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: 验证播放、权限、统计和页面竞态
        env:
          LXSC_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/lxsc-browser
        run: node tests/web/browser.cjs
      - name: 保存截图与验收结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-results
          path: ${{ runner.temp }}/lxsc-browser
          retention-days: 14

  build-only:
    name: 多架构构建，不登录或推送
    needs: [check, browser]
    # PR 和非发布分支的手动运行只有读取权限，与发布任务隔离。
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: 检出源码，不保存令牌
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 为 arm64 运行层启用 QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      - name: 配置 Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: 仅构建双架构镜像
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=lxsc-validation
          cache-to: type=gha,mode=max,scope=lxsc-validation

  publish:
    name: 构建并发布 GHCR
    needs: [check, browser]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出源码，不保存令牌
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 规范镜像名称与版本
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: 为 arm64 运行层启用 QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      - name: 配置 Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: 使用本次工作流令牌登录 GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成镜像标签与来源元数据
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.licenses=Apache-2.0 AND LicenseRef-LXSC-Third-Party
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
      - name: 发布双架构镜像
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: VERSION=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=lxsc-publish
          cache-to: type=gha,mode=max,scope=lxsc-publish
