name: 检查与镜像

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

jobs:
  check:
    name: 测试、许可与可复现构建
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 检出源码，不保存令牌
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # 竞态与非竞态编译不能抢占同一个不可变缓存键。
          cache-dependency-path: |
            go.sum
            scripts/check.sh
      - name: 安装 Node LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: 安装固定版本 Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: 安装音频解码验证依赖
        timeout-minutes: 4
        run: bash scripts/prepare-ci-media.sh
      - name: Go 竞态检测、静态检查与 Node 单元测试
        run: bash scripts/check.sh --race
      - name: 按锁文件构建并核对提交的 JS 产物
        working-directory: js-bridge
        run: |
          bun install --frozen-lockfile
          bun run build
          git diff --exit-code -- bun.lock bundle-inputs.json ../internal/assets/js/
      - name: 核对实际分发依赖和许可原文
        run: node scripts/licenses.mjs --check

  benchmark:
    name: 合成性能基准
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出源码，不保存令牌
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: 记录合成性能基准，不以机器耗时设置脆弱门槛
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/music ./internal/db -run '^$' -bench 'Benchmark(TemporaryCache|ConcurrentSearch|PersistentURLCacheHit|ListeningWithUserLookups)$' -benchmem -benchtime=100x -count=3 | tee "$RUNNER_TEMP/lxsc-benchmarks.txt"
          go test ./internal/db -run '^$' -bench 'Benchmark(TrackSubstringSearch|LibraryTrackIDs)$' -benchmem -benchtime=20x -count=3 | tee -a "$RUNNER_TEMP/lxsc-benchmarks.txt"
          go test ./internal/db -run '^$' -bench 'Benchmark(TrackSearchScenarios|PlaylistBatchWrite)$' -benchmem -benchtime=20x -count=3 | tee -a "$RUNNER_TEMP/lxsc-benchmarks.txt"
      - name: 保存性能基准
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-baseline
          path: ${{ runner.temp }}/lxsc-benchmarks.txt
          retention-days: 14

  browser:
    name: 隔离 Chromium 验收
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出源码，不保存令牌
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tests/web/package-lock.json
      - name: 安装 Node LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Playwright 1.58.2 的归档解包在 Node 26 下可能挂起，使用已验证的 LTS。
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - name: 安装锁定的浏览器测试依赖
        timeout-minutes: 3
        run: npm --prefix tests/web ci --ignore-scripts
      # 浏览器夹具也走真实的服务端音频内容验证。
      - name: 安装音频解码验证依赖
        timeout-minutes: 4
        run: bash scripts/prepare-ci-media.sh
      - name: 安装匹配版本的 Chromium Headless Shell
        timeout-minutes: 5
        env:
          DEBUG: pw:install
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
        run: node tests/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: 验证播放、权限、统计和页面竞态
        env:
          LXSC_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/lxsc-browser
        run: node tests/web/browser.cjs
      - name: 保存截图与验收结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-results
          path: ${{ runner.temp }}/lxsc-browser
          retention-days: 14

  build-only:
    name: 原生构建检查 (${{ matrix.arch }})
    needs: [check, browser, benchmark]
    # PR 和非发布分支的手动运行只有读取权限，与发布任务隔离。
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: 检出源码，不保存令牌
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Go 并复用编译缓存
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            scripts/build-ci-binary.sh
      - name: 原生编译二进制
        run: bash scripts/build-ci-binary.sh '${{ matrix.arch }}' "$GITHUB_SHA"
      - name: 配置 Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: 构建并加载当前架构镜像
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ci
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: lxsc:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=lxsc-native-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=lxsc-native-${{ matrix.arch }}
      - name: 验证实际镜像音频解码及许可记录
        run: bash scripts/check-image-audio.sh 'lxsc:ci-${{ matrix.arch }}'

  publish:
    name: 原生构建并发布 digest (${{ matrix.arch }})
    needs: [check, browser, benchmark]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    outputs:
      digest_amd64: ${{ steps.digest.outputs.digest_amd64 }}
      digest_arm64: ${{ steps.digest.outputs.digest_arm64 }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出源码，不保存令牌
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 规范镜像名称与版本
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: 安装 Go 并复用编译缓存
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            scripts/build-ci-binary.sh
      - name: 原生编译二进制
        env:
          LXSC_BUILD_VERSION: ${{ steps.image.outputs.version }}
        run: bash scripts/build-ci-binary.sh '${{ matrix.arch }}' "$LXSC_BUILD_VERSION"
      - name: 配置 Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: 使用本次工作流令牌登录 GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成镜像标签与来源元数据
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.licenses=Apache-2.0 AND LicenseRef-LXSC-Third-Party
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
      - name: 发布当前架构的 digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ci
          platforms: linux/${{ matrix.arch }}
          push: true
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=lxsc-native-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=lxsc-native-${{ matrix.arch }}
      - name: 验证实际镜像音频解码及许可记录
        env:
          LXSC_IMAGE_REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: bash scripts/check-image-audio.sh "$LXSC_IMAGE_REF"
      - name: 保存经过验证的镜像 digest
        id: digest
        env:
          LXSC_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          LXSC_IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          [[ "$LXSC_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest_${LXSC_IMAGE_ARCH}=$LXSC_IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

  manifest:
    name: 合并并发布双架构标签
    needs: [publish]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: 规范镜像名称
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: 配置 Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: 使用本次工作流令牌登录 GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成最终镜像标签
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
      - name: 发布完整双架构 manifest
        env:
          LXSC_IMAGE_NAME: ${{ steps.image.outputs.name }}
          LXSC_IMAGE_METADATA: ${{ steps.metadata.outputs.json }}
          LXSC_DIGEST_AMD64: ${{ needs.publish.outputs.digest_amd64 }}
          LXSC_DIGEST_ARM64: ${{ needs.publish.outputs.digest_arm64 }}
        run: |
          tagArgs=()
          while IFS= read -r imageTag; do
            tagArgs+=(-t "$imageTag")
          done < <(jq -r '.tags[]' <<< "$LXSC_IMAGE_METADATA")
          digestArgs=()
          for imageDigest in "$LXSC_DIGEST_AMD64" "$LXSC_DIGEST_ARM64"; do
            [[ "$imageDigest" =~ ^sha256:[0-9a-f]{64}$ ]]
            digestArgs+=("$LXSC_IMAGE_NAME@$imageDigest")
          done
          [[ ${#digestArgs[@]} -eq 2 && ${#tagArgs[@]} -ge 2 ]]
          docker buildx imagetools create "${tagArgs[@]}" "${digestArgs[@]}"
          docker buildx imagetools inspect "$LXSC_IMAGE_NAME:sha-$GITHUB_SHA" --raw | jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]'
